name: Football Real-Time Quant Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-analyzer:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Extracción y Modelado con Datos Reales
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python main.py

      - name: Guardar Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-apuestas-reales
          path: output_report.md
